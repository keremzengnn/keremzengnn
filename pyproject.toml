[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcs7-analyzer"
version = "0.1.0"
description = "PCS 7 (STEP 7 V5.x) proje backup'ını offline okuyan upgrade ön değerlendirme aracı"
requires-python = ">=3.11"
dependencies = []  # dbfread 2.0.7 pcs7_analyzer/_vendor altında gömülü

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pcs7-analyzer = "pcs7_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["pcs7_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pcs7_analyzer = ["data/*", "_vendor/dbfread/LICENSE"]
